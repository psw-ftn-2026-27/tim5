<div class="field">
  <span class="label">Images</span>

  @if (images().length > 0) {
    <ul class="thumbnails">
      @for (image of images(); track image.key; let index = $index) {
        <li class="thumbnail">
          <img [src]="image.previewUrl" alt="Image {{ index + 1 }}" />
          @if (image.uploading) {
            <span class="meta">Uploading…</span>
          } @else {
            <button class="button" type="button" (click)="imageRemoved.emit(image)">Remove</button>
          }
        </li>
      }
    </ul>
  }

  <label class="button" for="image-file" [class.disabled]="!canAdd()">Add image</label>
  <input
    id="image-file"
    class="file-input"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    [disabled]="!canAdd()"
    (change)="pick($event)"
  />

  @if (checkError()) {
    <p class="error">{{ checkError() }}</p>
  }
  @if (serverError()) {
    <p class="error">{{ serverError() }}</p>
  }
</div>
